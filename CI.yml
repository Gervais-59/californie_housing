name: CI - Tests

# Quand se déclencher : à chaque push et pull request sur main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest   # la machine neuve fournie par GitHub
    steps:
      # 1. Récupérer mon code sur la machine vide
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Installer tes dépendances
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # 4. Entraîner le modèle (car la machine est vide !)
      - name: Entraîner le modèle
        run: python mlops.py

      # 5. Lancer les tests
      - name: Lancer les tests
        run: pytest -v